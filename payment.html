<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
<link rel="icon" href="/favicon.ico?v=20261115-photo" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=20261115-photo">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20261115-photo">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer">
  <title>서류대리님 - 실비 결제</title>
  <link rel="stylesheet" href="/design.css?v=20261124-three-steps">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4ede2; color: #291e14; font-family: var(--sd-font-body, sans-serif); display: grid; place-items: center; min-height: 100vh; min-height: 100dvh; padding: 16px; }
    main { background: #fdfaf5; border: 1px solid #e5dacc; border-radius: 18px; width: min(100%, 420px); padding: clamp(20px, 6vw, 30px); }
    .brand, h1, .amount { font-family: var(--sd-font-title, sans-serif); font-weight: 400; }
    .brand { color: #795533; font-size: 18px; margin: 0 0 24px; }
    h1 { font-size: 23px; margin: 0 0 4px; }
    .amount { font-size: 36px; margin: 0 0 18px; overflow-wrap: anywhere; }
    dl { margin: 0 0 20px; }
    .row { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; }
    dt, .note { color: #655344; }
    dt { flex-shrink: 0; }
    dd { margin: 0; text-align: right; overflow-wrap: anywhere; }
    .bank { background: #f2e9db; border-radius: 12px; padding: 16px; margin-bottom: 10px; }
    .bank strong { display: block; font-size: clamp(21px, 6vw, 26px); margin-top: 5px; overflow-wrap: anywhere; }
    .copy-btn { width: 100%; min-height: 48px; font: inherit; color: #fffaf3; background: #775431; border: 0; border-radius: 10px; cursor: pointer; }
    .note { font-size: 14px; line-height: 1.55; margin: 14px 0 0; }
    footer { margin-top: 14px; }
    a { display: inline-flex; align-items: center; min-height: 40px; color: #684a2e; }
    :is(button, a):focus-visible { outline: 2px solid #704c26; outline-offset: 3px; }
  </style>
</head>
<body>
<main>
  <p class="brand">서류대리님</p>
  <section id="payScreen" style="display:none">
    <h1>병원 서류 발급비</h1>
    <p class="amount" id="dispAmount"></p>
    <dl>
      <div class="row"><dt>고객명</dt><dd id="dispName"></dd></div>
      <div class="row"><dt>주문번호</dt><dd id="dispOrderId"></dd></div>
    </dl>
    <div class="bank">
      <span>IBK기업은행 · 배승휴(서류대리님)</span>
      <strong id="accountNum">523-082856-04-011</strong>
    </div>
    <button type="button" class="copy-btn" aria-live="polite" onclick="copyAccount()">계좌번호 복사</button>
    <p class="note">문자로 받은 주문번호와 금액을 확인한 뒤 입금해 주세요. 입금 상태는 이 화면에 표시되지 않아요.</p>
  </section>
  <section id="errorScreen" style="display:none">
    <h1>입금 안내 링크를 확인해 주세요</h1>
    <p class="note">문자로 받은 링크를 다시 열거나 카카오톡으로 새 링크를 요청해 주세요.</p>
  </section>
  <noscript>입금 안내를 보려면 자바스크립트를 켜 주세요.</noscript>
  <footer><a href="https://pf.kakao.com/_XxjhEX">카카오톡 문의</a></footer>
</main>

<script>
var params  = new URLSearchParams(window.location.search);
var orderId = (params.get('order_id') || '').trim();
var rawAmount = (params.get('amount') || '').trim();
var amount  = /^\d+$/.test(rawAmount) ? Number(rawAmount) : NaN;
var name    = (params.get('name') || '').trim() || '고객';
var copyLabelTimer;

if (!orderId || !Number.isSafeInteger(amount) || amount < 100) {
  document.getElementById('payScreen').style.display = 'none';
  document.getElementById('errorScreen').style.display = 'block';
} else {
  document.getElementById('dispName').textContent = name;
  document.getElementById('dispOrderId').textContent = orderId;
  document.getElementById('dispAmount').textContent = amount.toLocaleString('ko-KR') + '원';
  document.getElementById('payScreen').style.display = 'block';
}

function copyAccount() {
  var acc = document.getElementById('accountNum').textContent.replace(/[^0-9]/g, '');
  var fallback = function() { prompt('계좌번호를 복사해 주세요:', acc); };
  if (!navigator.clipboard || typeof navigator.clipboard.writeText !== 'function') {
    fallback();
    return;
  }
  Promise.resolve().then(function() {
    return navigator.clipboard.writeText(acc);
  }).then(function() {
    var btn = document.querySelector('.copy-btn');
    if (copyLabelTimer != null && typeof clearTimeout === 'function') clearTimeout(copyLabelTimer);
    btn.textContent = '복사했어요 ✓';
    copyLabelTimer = setTimeout(function() { btn.textContent = '계좌번호 복사'; }, 2000);
  }).catch(fallback);
}
</script>
</body>
</html>
